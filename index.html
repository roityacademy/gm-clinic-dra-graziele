<style>/* Layout: proposta = página editorial com faixas pretas e marfim; demonstração = app claro com barra lateral (desktop) e navegação inferior (celular). */
:root{
  --black:#050505; --graphite:#171717; --gold:#C9A75F; --gold-l:#E8D39C; --ivory:#FAF8F4; --warm:#80796E;
  --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#F3EFE7; --fg:#1B1814; --muted:#7A7368; --line:#E7E0D3; --line-2:#D9D0BF;
  --accent:#C9A75F; --accent-ink:#8C6B2E; --accent-soft:#F4ECDB; --on-accent:#120F0A;
  --band:#050505; --band-2:#121110; --band-fg:#F2ECE1; --band-muted:#A79F92; --band-line:#2A2722;
  --ok:#3E7D5A; --ok-bg:#E5F0E8; --warn:#9A6B12; --warn-bg:#F7EDD6; --bad:#A3423B; --bad-bg:#F6E3E0; --info:#3F5F82; --info-bg:#E3EAF2; --teal:#2F7470; --teal-bg:#DDEEEC; --neutral-bg:#ECE8E1;
  --chat-bg:#F1ECE2; --bubble-in:#FFFFFF; --bubble-out:#F3E7CB; --bubble-sys:#E9E3D7;
  --shadow:0 1px 2px rgba(40,30,10,.05),0 8px 24px rgba(40,30,10,.06);
  --f-display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --f-body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0D0B; --surface:#171613; --surface-2:#1F1D19; --fg:#F2ECE1; --muted:#A39B8E; --line:#2B2823; --line-2:#3A362F;
  --accent:#C9A75F; --accent-ink:#DDC183; --accent-soft:#2A241A; --on-accent:#120F0A;
  --ok:#7CC09A; --ok-bg:#1C2B22; --warn:#E0B45C; --warn-bg:#2E2615; --bad:#E58E86; --bad-bg:#33201E; --info:#8FB0D6; --info-bg:#1C2530; --teal:#7CC6C0; --teal-bg:#18292A; --neutral-bg:#26231F;
  --chat-bg:#12110F; --bubble-in:#1F1D19; --bubble-out:#3A3020; --bubble-sys:#24221E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0D0B; --surface:#171613; --surface-2:#1F1D19; --fg:#F2ECE1; --muted:#A39B8E; --line:#2B2823; --line-2:#3A362F;
  --accent:#C9A75F; --accent-ink:#DDC183; --accent-soft:#2A241A; --on-accent:#120F0A;
  --ok:#7CC09A; --ok-bg:#1C2B22; --warn:#E0B45C; --warn-bg:#2E2615; --bad:#E58E86; --bad-bg:#33201E; --info:#8FB0D6; --info-bg:#1C2530; --teal:#7CC6C0; --teal-bg:#18292A; --neutral-bg:#26231F;
  --chat-bg:#12110F; --bubble-in:#1F1D19; --bubble-out:#3A3020; --bubble-sys:#24221E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--band)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-ink);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.hide{display:none!important}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:500;letter-spacing:.02em;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--gold-l)}
.btn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.caps{text-transform:uppercase;letter-spacing:.12em;font-size:12px;padding:12px 20px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--neutral-bg);color:var(--fg);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-solicitado{background:var(--info-bg);color:var(--info)}
.st-reservado{background:var(--warn-bg);color:var(--warn)}
.st-confirmado{background:var(--ok-bg);color:var(--ok)}
.st-compareceu{background:var(--teal-bg);color:var(--teal)}
.st-concluido{background:var(--neutral-bg);color:var(--muted)}
.st-cancelado{background:var(--bad-bg);color:var(--bad)}
.st-falta{background:var(--bad-bg);color:var(--bad)}
.st-bloqueio{background:var(--neutral-bg);color:var(--muted)}
.c-ia{background:var(--accent-soft);color:var(--accent-ink)}
.c-aguardando{background:var(--warn-bg);color:var(--warn)}
.c-humano{background:var(--info-bg);color:var(--info)}
.c-resolvida{background:var(--neutral-bg);color:var(--muted)}
.tag{display:inline-flex;padding:2px 8px;border-radius:5px;font-size:11.5px;border:1px solid var(--line-2);color:var(--muted)}
.demo-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);color:var(--gold)}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);letter-spacing:.03em}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;font-size:14px;min-width:0}
textarea.input{resize:vertical;min-height:70px;line-height:1.5}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.input.err{border-color:var(--bad)}
.errtxt{color:var(--bad);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.switch{position:relative;width:40px;height:22px;flex:none;border-radius:999px;background:var(--line-2);border:none;transition:background .15s;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{left:21px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:none;background:transparent;padding:6px 13px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:21px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:20px}
.note{border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;color:var(--muted);background:var(--surface-2)}
.note b{color:var(--fg);font-weight:500}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}

/* ================= PROPOSTA (PITCH) ================= */
.pitch{background:var(--band);color:var(--band-fg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.p-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--band) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--band-line)}
.p-top .wrap{display:flex;align-items:center;gap:18px;height:62px}
.p-top img{height:38px;width:auto}
.p-top nav{display:flex;gap:20px;margin-left:auto;font-size:13px}
.p-top nav a{color:var(--band-muted);text-decoration:none;letter-spacing:.04em}
.p-top nav a:hover{color:var(--gold-l)}
@media (max-width:900px){.p-top nav{display:none}.p-top .btn{margin-left:auto}}
.band{padding-block:88px;border-bottom:1px solid var(--band-line)}
.band.light{background:var(--bg);color:var(--fg);border-bottom-color:var(--line)}
.band.ivory{background:var(--surface-2);color:var(--fg);border-bottom-color:var(--line)}
.band h2{font-size:clamp(32px,4.4vw,52px);max-width:22ch}
.band .lead{font-size:17px;max-width:62ch;margin-top:16px;color:var(--band-muted)}
.band.light .lead,.band.ivory .lead{color:var(--muted)}
.band .eyebrow{color:var(--gold);margin-bottom:14px;display:block}
.band.light .eyebrow,.band.ivory .eyebrow{color:var(--accent-ink)}
@media (max-width:640px){.band{padding-block:60px}}

.hero{padding-block:56px 72px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -20% -40% 30%;height:70%;background:radial-gradient(closest-side,rgba(201,167,95,.13),transparent);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:center;position:relative;z-index:1}
.hero-logo{width:min(300px,70%);height:auto;display:block;margin-bottom:26px}
.hero h1{font-size:clamp(36px,4.6vw,60px);font-weight:500}
.hero h1 em{font-style:italic;color:var(--gold-l)}
.hero .sub{font-size:17.5px;color:var(--band-muted);margin-top:18px;max-width:46ch}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.hero .btn{background:transparent;color:var(--band-fg);border-color:#3a352c}
.hero .btn.primary{background:var(--gold);color:#120F0A;border-color:var(--gold)}
.seal{margin-top:22px;display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--band-muted);border:1px solid var(--band-line);padding:6px 12px;border-radius:999px}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero{padding-block:36px 56px}}

/* Composição de dispositivos */
.devices{position:relative;aspect-ratio:1.15/1;max-width:100%}
.laptop{position:absolute;left:0;top:6%;width:80%;}
.laptop .screen{background:var(--ivory);border:8px solid #1d1b18;border-radius:12px 12px 0 0;aspect-ratio:16/10;overflow:hidden;display:grid;grid-template-columns:22% 1fr;color:#1B1814}
.laptop .base{height:12px;background:linear-gradient(#2b2925,#141310);border-radius:0 0 14px 14px;margin:0 -5%}
.mini-side{background:#0c0b0a;padding:8% 10%;display:flex;flex-direction:column;gap:7%}
.mini-side i{display:block;height:5px;border-radius:3px;background:#2b2822}
.mini-side i.g{background:var(--gold)}
.mini-main{padding:6%;display:flex;flex-direction:column;gap:6%}
.mini-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:5%}
.mini-cards div{background:#fff;border:1px solid #ebe4d6;border-radius:4px;height:28px;padding:4px}
.mini-cards b{display:block;height:6px;width:50%;background:var(--gold);border-radius:2px;margin-top:9px}
.mini-cal{flex:1;background:#fff;border:1px solid #ebe4d6;border-radius:4px;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:5px}
.mini-cal span{border-radius:2px;background:#f3eee4}
.mini-cal span.a{background:#e9dcbc}.mini-cal span.b{background:#d6e7dc}.mini-cal span.c{background:#dbe4ee}
.a4mock{position:absolute;right:13%;bottom:0;width:30%;aspect-ratio:1/1.414;background:#fff;border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.55);padding:5%;transform:rotate(-4deg);display:flex;flex-direction:column;gap:6%;color:#111}
.a4mock img{width:46%;align-self:center}
.a4mock i{display:block;height:3px;background:#e5dfd3;border-radius:2px}
.a4mock i.gl{background:var(--gold);height:1px}
.phone{position:absolute;right:0;top:0;width:27%;aspect-ratio:9/19;background:#0b0a09;border:6px solid #23211d;border-radius:26px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6);display:flex;flex-direction:column}
.phone .ph-h{background:#151411;color:var(--gold-l);font-size:9px;padding:14px 8px 7px;letter-spacing:.06em}
.phone .ph-b{flex:1;background:#f1ece2;padding:8px 6px;display:flex;flex-direction:column;gap:5px}
.phone .bb{max-width:85%;padding:5px 7px;border-radius:8px;font-size:8px;line-height:1.3;color:#1B1814}
.phone .bb.in{background:#fff;align-self:flex-start}
.phone .bb.out{background:#f3e7cb;align-self:flex-end}
.phone .slot{align-self:flex-end;display:flex;gap:4px}
.phone .slot span{font-size:7.5px;border:1px solid var(--gold);border-radius:999px;padding:2px 6px;color:#6b5121;background:#fff}

/* Desafio */
.hyp{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:36px}
.hyp div{border:1px solid var(--band-line);border-radius:var(--r);padding:16px 18px;font-size:15px;color:var(--band-fg);display:flex;gap:12px;align-items:flex-start}
.hyp div .icon{color:var(--gold);margin-top:2px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.compare>div{border-radius:var(--r);padding:22px;min-height:260px;position:relative;overflow:hidden}
.frag{border:1px dashed #3a352c}
.cent{border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);background:linear-gradient(180deg,rgba(201,167,95,.07),transparent)}
.compare h4{font-family:var(--f-body);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--band-muted)}
.scatter{position:relative;height:200px;margin-top:10px}
.scatter span{position:absolute;font-size:12.5px;padding:5px 11px;border:1px solid #3a352c;border-radius:999px;color:var(--band-muted);background:#0d0c0b}
.hub{display:grid;place-items:center;height:200px;margin-top:10px;position:relative}
.hub .core{width:112px;height:112px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:18px;color:var(--gold-l);z-index:1;background:var(--band)}
.hub span{position:absolute;font-size:12px;padding:4px 10px;border-radius:999px;background:#1a1814;color:var(--band-fg);border:1px solid #3a352c}
@media (max-width:760px){.compare{grid-template-columns:1fr}}

/* Solução */
.sol{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:36px}
.sol button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s;min-height:150px}
.sol button:hover{border-color:var(--accent);transform:translateY(-2px)}
.sol h4{font-size:21px}
.sol p{font-size:14px;color:var(--muted)}
.sol .go{margin-top:auto;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);display:flex;gap:6px;align-items:center}
.sol .icon{color:var(--accent-ink);width:22px;height:22px}

/* Fluxo IA */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:40px;counter-reset:f}
.flow>div{padding:0 14px 0 0;position:relative}
.flow>div::before{content:"";position:absolute;top:21px;left:44px;right:0;height:1px;background:linear-gradient(90deg,var(--gold),#3a352c)}
.flow>div:last-child::before{display:none}
.flow .n{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-l);font-family:var(--f-display);font-size:20px;background:var(--band);position:relative}
.flow h4{font-size:20px;margin-top:14px;color:var(--band-fg)}
.flow p{font-size:13.5px;color:var(--band-muted);margin-top:6px}
.flow .who{display:inline-block;margin-top:10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--band-line);color:var(--band-muted)}
.flow .who.you{border-color:var(--gold);color:var(--gold)}
@media (max-width:900px){.flow{grid-template-columns:1fr;gap:22px}.flow>div::before{display:none}.flow>div{display:grid;grid-template-columns:42px 1fr;column-gap:16px}.flow h4{margin-top:6px}.flow>div>*:not(.n){grid-column:2}.flow .n{grid-row:span 3}}
.approve-demo{margin-top:40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:center}
.push{background:rgba(30,28,24,.92);border:1px solid #3a352c;border-radius:18px;padding:14px 16px;display:flex;gap:12px;max-width:380px;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.push img{width:38px;height:38px;border-radius:9px;background:#0b0a09;padding:5px;object-fit:contain}
.push b{font-size:13px;color:var(--band-fg);font-weight:500}
.push p{font-size:13px;color:var(--band-muted)}
.push .acts{display:flex;gap:8px;margin-top:9px}
.push .acts span{font-size:12px;padding:5px 12px;border-radius:999px;background:#2b2822;color:var(--band-fg)}
.push .acts span.y{background:var(--gold);color:#120F0A}
@media (max-width:760px){.approve-demo{grid-template-columns:1fr}}

/* Jornada */
.journey{display:flex;gap:0;overflow-x:auto;padding:30px 0 12px;margin-top:20px;scroll-snap-type:x proximity}
.journey button{flex:0 0 150px;scroll-snap-align:start;background:none;border:none;text-align:left;padding:0 10px 0 0;position:relative;color:var(--fg)}
.journey button::before{content:"";position:absolute;top:9px;left:20px;right:0;height:1px;background:var(--line-2)}
.journey button:last-child::before{display:none}
.journey .d{width:19px;height:19px;border-radius:50%;border:1px solid var(--accent);background:var(--bg);display:block;position:relative;z-index:1;transition:background .15s}
.journey button:hover .d{background:var(--accent)}
.journey b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;margin-top:12px}
.journey span.s{font-size:12.5px;color:var(--muted);display:block;margin-top:4px;padding-right:10px}

/* Recebe / status */
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:36px}
.cols3>div{border-radius:var(--r);padding:22px;background:var(--surface);border:1px solid var(--line)}
.cols3 h4{font-family:var(--f-body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;display:flex;gap:8px;align-items:center}
.cols3 ul{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.cols3 li{display:flex;gap:9px;align-items:flex-start}
.cols3 li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;margin-top:8px;background:var(--k,var(--accent))}
.k-in{--k:var(--ok)}.k-dep{--k:var(--warn)}.k-fut{--k:var(--info)}
@media (max-width:860px){.cols3{grid-template-columns:1fr}}

/* Mobile showcase */
.phones{display:flex;gap:18px;overflow-x:auto;padding:30px 2px 10px;scroll-snap-type:x proximity}
.phones .ph{flex:0 0 200px;scroll-snap-align:start}
.phones .ph .fr{aspect-ratio:9/18.5;border:6px solid #23211d;border-radius:28px;background:var(--ivory);overflow:hidden;color:#1B1814;display:flex;flex-direction:column}
.phones .ph p{font-size:13px;color:var(--band-muted);margin-top:10px;text-align:center}
.fr .top{background:#0b0a09;color:var(--gold-l);font-size:10px;padding:16px 10px 8px;letter-spacing:.08em;text-transform:uppercase}
.fr .bd{padding:10px;display:flex;flex-direction:column;gap:7px;font-size:10.5px;flex:1}
.fr .it{background:#fff;border:1px solid #ebe4d6;border-radius:7px;padding:7px 8px;display:flex;justify-content:space-between;gap:6px}
.fr .it b{font-weight:500}
.fr .gold{color:#8C6B2E}
.fr .home{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 10px;background:linear-gradient(160deg,#2a2620,#0b0a09);flex:1;align-content:start}
.fr .home i{aspect-ratio:1;border-radius:10px;background:#3a352c;display:block}

/* Investimento */
.invest{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px;margin-top:40px}
.invest>div{border:1px solid var(--band-line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:10px}
.invest .main{border-color:var(--gold);background:linear-gradient(170deg,rgba(201,167,95,.10),transparent 60%)}
.invest .lbl2{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.invest .big{font-family:var(--f-display);font-size:clamp(46px,6vw,68px);line-height:1;color:var(--band-fg);font-weight:500}
.invest .mid{font-family:var(--f-display);font-size:34px;line-height:1.1;color:var(--band-fg)}
.invest p{font-size:14px;color:var(--band-muted)}
@media (max-width:900px){.invest{grid-template-columns:1fr}}
.scope{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:28px}
.scope div{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line)}
.scope .icon{color:var(--ok);margin-top:2px}
.warnbox{margin-top:22px;border-left:3px solid var(--warn);background:var(--warn-bg);padding:14px 16px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:14px;color:var(--fg)}

/* Cronograma */
.timeline{margin-top:36px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.timeline>div{border-top:2px solid var(--accent);padding-top:14px}
.timeline .d{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.timeline h4{font-size:21px;margin-top:6px}
.timeline p{font-size:13.5px;color:var(--muted);margin-top:6px}
.timeline .ev{margin-top:10px;font-size:13px;background:var(--accent-soft);border-radius:var(--r-sm);padding:9px 10px;color:var(--fg)}
@media (max-width:900px){.timeline{grid-template-columns:1fr}}

.ba{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px}
.ba>div{border-radius:var(--r);padding:22px;border:1px solid var(--line);background:var(--surface)}
.ba ul{margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.ba .after{border-color:var(--accent)}
@media (max-width:760px){.ba{grid-template-columns:1fr}}

.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}
.plans>div{border:1px solid var(--band-line);border-radius:var(--r);padding:20px}
.plans h4{font-size:24px;color:var(--band-fg)}
.plans .pr{font-size:13px;color:var(--band-muted);margin:6px 0 12px;border:1px dashed #3a352c;border-radius:6px;padding:6px 8px}
.plans ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--band-muted);display:flex;flex-direction:column;gap:5px}
@media (max-width:860px){.plans{grid-template-columns:1fr}}
.steps-h{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.steps-h span{font-size:13px;border:1px solid var(--band-line);border-radius:999px;padding:6px 12px;color:var(--band-fg)}
.steps-h span.ar{border:none;color:var(--gold);padding:6px 0}

.close{text-align:center;padding-block:96px}
.close img{width:min(280px,70%);margin:0 auto 30px;display:block}
.close h2{margin:0 auto;font-size:clamp(32px,4.6vw,54px);max-width:20ch}
.close .sum{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.close .sum span{border:1px solid var(--band-line);border-radius:999px;padding:7px 14px;font-size:13.5px;color:var(--band-fg)}
.close .ctas{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
.close .btn{background:transparent;color:var(--band-fg);border-color:#3a352c}
.close .btn.primary{background:var(--gold);border-color:var(--gold);color:#120F0A}
.p-foot{padding-block:28px;font-size:12px;color:var(--band-muted);text-align:center}

/* ================= DEMO APP ================= */
.app{min-height:100%;display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:auto 1fr}
.topbar{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--band);color:var(--band-fg);display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--band-line)}
.topbar .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:none;border:none;padding:0}
.topbar .brand img{height:34px;width:auto}
.topbar .brand b{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.04em;color:var(--gold-l)}
.topbar .brand small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted);line-height:1}
.topbar .sp{flex:1}
.topbar .tb-btn{background:transparent;border:1px solid var(--band-line);color:var(--band-fg);border-radius:999px;padding:7px 12px;font-size:12.5px;display:inline-flex;gap:7px;align-items:center}
.topbar .tb-btn:hover{border-color:var(--gold)}
.bell{position:relative}
.bell .cnt{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#120F0A;font-size:10.5px;font-weight:600;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.prof-sel{background:#1a1814;border:1px solid var(--band-line);color:var(--band-fg);border-radius:999px;padding:6px 10px;font-size:12.5px;max-width:200px}
@media (max-width:760px){.topbar .brand div{display:none}.topbar .hide-m{display:none}.prof-sel{max-width:130px}}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);height:calc(100vh - 56px);overflow:auto;display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.side button{display:flex;align-items:center;gap:11px;border:none;background:transparent;padding:9px 10px;border-radius:8px;font-size:14px;color:var(--fg);text-align:left;width:100%}
.side button:hover{background:var(--surface-2)}
.side button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.side button .icon{color:var(--muted)}
.side button.on .icon{color:var(--accent-ink)}
.side .badge{margin-left:auto;font-size:11px;background:var(--gold);color:#120F0A;border-radius:999px;padding:1px 7px;font-weight:600}
.side .foot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}
.main{padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));min-width:0}
@media (min-width:761px){.main{padding-left:28px;padding-right:28px}}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-h h1{font-size:clamp(28px,3.4vw,38px);font-weight:500}
.page-h p{color:var(--muted);margin-top:4px;font-size:14.5px}
.bnav{display:none}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bnav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:5px 2px;position:relative}
  .bnav button.on{color:var(--accent-ink)}
  .bnav .badge{position:absolute;top:0;right:22%;font-size:9.5px;background:var(--gold);color:#120F0A;border-radius:999px;padding:0 5px;font-weight:600}
}
.more-sheet .side-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.more-sheet .side-list button{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px;font-size:14px;text-align:left}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
button.kpi:hover{border-color:var(--accent)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:34px;line-height:1.05;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{border-color:var(--accent);background:linear-gradient(170deg,var(--accent-soft),var(--surface) 70%)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:1100px){.dash-grid{grid-template-columns:1fr}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select{width:auto}

/* Approval list */
.appr{display:flex;flex-direction:column;gap:10px}
.appr-it{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.appr-it.new{border-color:var(--accent);animation:pulse 1.6s ease 2}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}}
.appr-it .who{font-weight:500}
.appr-it .when{font-size:13px;color:var(--muted)}

/* Bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fl{height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.vbars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;border-bottom:1px solid var(--line)}
.vbars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.vbars .b{width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;transition:height .4s;min-height:2px}
.vbars .b.alt{background:var(--line-2)}
.vbars .v{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.vlabels{display:flex;gap:8px;margin-top:6px}
.vlabels span{flex:1;text-align:center;font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Lists/tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .t{font-variant-numeric:tabular-nums;font-weight:500;width:48px;flex:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}

/* Agenda */
.cal-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cal{display:grid;min-width:760px;position:relative}
.cal .hd{position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--line);padding:9px 8px;font-size:12.5px;text-align:center;z-index:2}
.cal .hd b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600}
.cal .hd.today b{color:var(--accent-ink)}
.cal .tcol{border-right:1px solid var(--line)}
.cal .tcol div{height:var(--slot);font-size:11px;color:var(--muted);text-align:right;padding:0 6px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.cal .dcol{position:relative;border-right:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% calc(var(--slot) * 2)}
.cal .dcol:last-child{border-right:none}
.cal .closed{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px)}
.cal .nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3}
.ev{position:absolute;left:3px;right:3px;border-radius:6px;padding:4px 7px;font-size:11.5px;line-height:1.25;overflow:hidden;border:none;text-align:left;border-left:3px solid currentColor;z-index:1;cursor:pointer}
.ev b{display:block;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{color:var(--fg);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ev .ia{position:absolute;top:3px;right:4px;font-size:9px;letter-spacing:.06em;font-weight:600;background:var(--surface);padding:0 4px;border-radius:3px;color:var(--accent-ink)}
.ev.st-cancelado{opacity:.55;text-decoration:line-through}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.month .mh{padding:8px;font-size:12px;color:var(--muted);text-align:center;background:var(--surface-2);border-bottom:1px solid var(--line)}
.month .md{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;font-size:12px;text-align:left;background:var(--surface);border-top:none;border-left:none;display:flex;flex-direction:column;gap:3px}
.month .md.out{color:var(--muted);background:var(--surface-2)}
.month .md.today .dn{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 7px}
.month .md .dn{font-weight:500;align-self:flex-start}
.month .md .mi{font-size:11px;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.month .md{min-height:64px;padding:4px}.month .md .mi{display:none}.month .md .cnt{display:block}}
.month .md .cnt{display:none;font-size:11px;color:var(--accent-ink)}
.daylist .li{align-items:flex-start}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* Atendimento */
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);height:calc(100vh - 210px);min-height:540px}
.inbox .convs{border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.inbox .convs .ch{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cv{display:flex;gap:10px;padding:12px;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.cv:hover{background:var(--surface-2)}
.cv.on{background:var(--accent-soft)}
.cv .nm{font-weight:500;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.cv .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .un{background:var(--gold);color:#120F0A;font-size:10.5px;border-radius:999px;padding:0 6px;font-weight:600}
.chat{display:flex;flex-direction:column;min-width:0;background:var(--chat-bg)}
.chat .chh{padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 11px 6px;border-radius:10px;font-size:14px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.05);white-space:pre-wrap;word-wrap:break-word}
.msg.paciente{background:var(--bubble-in);align-self:flex-start;border-top-left-radius:3px}
.msg.ia,.msg.humano{background:var(--bubble-out);align-self:flex-end;border-top-right-radius:3px}
.msg.sistema{background:var(--bubble-sys);align-self:center;font-size:12px;color:var(--muted);max-width:92%;text-align:center;border-radius:8px}
.msg .meta{font-size:10.5px;color:var(--muted);margin-top:3px;text-align:right}
.msg .who{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;margin-bottom:2px}
.msg .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg .opts button{border:1px solid var(--accent);background:var(--surface);color:var(--accent-ink);border-radius:999px;padding:4px 10px;font-size:12.5px}
.typing{align-self:flex-end;font-size:12px;color:var(--muted);font-style:italic}
.compose{border-top:1px solid var(--line);background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px}
.compose .qr{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.compose .qr button{flex:none;border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compose form{display:flex;gap:8px}
.compose form .input{border-radius:999px}
.ctx{border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;font-size:13.5px}
.ctx h4{font-family:var(--f-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.acts-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts-grid .btn{padding:7px 8px;font-size:12px;white-space:normal;text-align:center}
@media (max-width:1180px){.inbox{grid-template-columns:260px minmax(0,1fr)}.inbox .ctx{display:none}.inbox.show-ctx .ctx{display:flex;position:absolute}}
@media (max-width:760px){
  .inbox{grid-template-columns:1fr;height:calc(100vh - 180px)}
  .inbox.has-sel .convs{display:none}
  .inbox:not(.has-sel) .chat{display:none}
}
.m-only{display:none}
@media (max-width:760px){.m-only{display:inline-flex}}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 250px;background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px;border:1px solid transparent}
.kcol.over{border-color:var(--accent);background:var(--accent-soft)}
.kcol .kh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;padding:2px 4px}
.kcol .kh span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px;font-size:13px}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.5}
.kcard .nm{font-weight:500;font-size:14px;background:none;border:none;padding:0;text-align:left}
.kcard .nm:hover{color:var(--accent-ink)}
.kcard select{font-size:12px;padding:4px 6px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface)}

/* Ficha */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
@media (max-width:540px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.restricted{border:1px solid var(--line-2);border-radius:var(--r);padding:20px;background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--surface-2) 10px 20px);text-align:center}
.timeline-v{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line-2);margin-left:6px}
.timeline-v div{padding:0 0 12px 16px;position:relative;font-size:13.5px}
.timeline-v div::before{content:"";position:absolute;left:-5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.timeline-v small{color:var(--muted);display:block;font-size:12px}

/* Proposta editor + A4 */
.ped{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.ped{grid-template-columns:1fr}}
.ped .form{display:flex;flex-direction:column;gap:12px}
.items-ed{display:flex;flex-direction:column;gap:8px}
.item-ed{display:grid;grid-template-columns:minmax(0,1fr) 54px 96px 28px;gap:6px;align-items:center}
.item-ed .input{padding:7px 8px;font-size:13px}
.item-ed .x{border:none;background:none;color:var(--muted);font-size:18px;padding:0}
.preview-wrap{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:20px;overflow:auto;position:sticky;top:76px;max-height:calc(100vh - 100px)}
@media (max-width:1100px){.preview-wrap{position:static;max-height:none;padding:10px}}
.a4{width:210mm;min-height:297mm;background:#fff;color:#1a1714;margin:0 auto;padding:18mm 18mm 16mm;box-shadow:0 10px 30px rgba(0,0,0,.12);font-family:var(--f-body);font-size:10.5pt;line-height:1.5;display:flex;flex-direction:column;transform-origin:top left}
.a4-scale{width:max-content;margin:0 auto}
.a4 .ah{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.a4 .ah img{width:52mm;height:auto}
.a4 .gl{height:1px;background:linear-gradient(90deg,transparent,#C9A75F 15%,#C9A75F 85%,transparent);margin:7mm 0 6mm}
.a4 h2{font-family:var(--f-display);font-weight:500;font-size:25pt;text-align:center;color:#111;letter-spacing:.01em}
.a4 .meta{display:flex;justify-content:space-between;font-size:9pt;color:#6b645a;margin-top:4mm;letter-spacing:.06em;text-transform:uppercase}
.a4 .for{margin-top:7mm}
.a4 .for small{display:block;font-size:8.5pt;letter-spacing:.16em;text-transform:uppercase;color:#8C6B2E}
.a4 .for b{font-family:var(--f-display);font-size:19pt;font-weight:600}
.a4 .msg-p{margin-top:4mm;font-family:var(--f-display);font-style:italic;font-size:13pt;color:#3a342c;line-height:1.45}
.a4 h5{font-family:var(--f-body);font-size:8.5pt;letter-spacing:.18em;text-transform:uppercase;color:#8C6B2E;margin:7mm 0 2.5mm;font-weight:600}
.a4 table{width:100%;border-collapse:collapse;font-size:10pt}
.a4 th{text-align:left;font-weight:500;font-size:8pt;letter-spacing:.12em;text-transform:uppercase;color:#6b645a;border-bottom:1px solid #C9A75F;padding:2.2mm 1.5mm}
.a4 td{padding:2.6mm 1.5mm;border-bottom:1px solid #ece6da;vertical-align:top}
.a4 td small{display:block;color:#6b645a;font-size:8.8pt}
.a4 .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.a4 .tot td{border-bottom:none;padding-top:2mm}
.a4 .tot .big{font-family:var(--f-display);font-size:17pt;font-weight:600;color:#111}
.a4 .fic{display:inline-block;font-size:7pt;letter-spacing:.12em;text-transform:uppercase;color:#9A6B12;border:1px solid #e5cf9f;border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:middle}
.a4 .two{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
.a4 p.t{font-size:9.6pt;color:#3a342c}
.a4 .sign{margin-top:auto;padding-top:12mm;display:flex;justify-content:space-between;align-items:flex-end;gap:10mm}
.a4 .sign .ln{border-top:1px solid #1a1714;width:70mm;padding-top:2mm;font-size:9pt;text-align:center}
.a4 .foot{margin-top:7mm;border-top:1px solid #C9A75F;padding-top:3mm;font-size:8.5pt;color:#6b645a;text-align:center;letter-spacing:.04em}
/* Layout Clinical */
.a4.clinical .ah{flex-direction:row;justify-content:space-between;text-align:left;align-items:center}
.a4.clinical .ah img{width:36mm}
.a4.clinical .gl{background:#1a1714;height:1.5px;margin:5mm 0}
.a4.clinical h2{text-align:left;font-family:var(--f-body);font-weight:500;font-size:19pt;letter-spacing:.02em}
.a4.clinical .msg-p{font-family:var(--f-body);font-style:normal;font-size:10.5pt}
.a4.clinical h5{color:#1a1714;border-bottom:1px solid #1a1714;padding-bottom:1.5mm}
.a4.clinical th{border-bottom-color:#1a1714}
.a4.clinical .foot{border-top-color:#1a1714}
.a4.clinical .for b{font-family:var(--f-body);font-size:15pt;font-weight:500}

/* Serviços */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.svc.off{opacity:.55}
.svc h4{font-size:22px}
.svc .meta{display:flex;gap:6px;flex-wrap:wrap}
.svc p{font-size:13.5px;color:var(--muted)}

/* Modal / drawer / toasts */
.overlay{position:fixed;inset:0;background:rgba(10,8,5,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column}
.modal.wide{width:min(980px,100%)}
.modal .mh{padding:18px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mh h3{font-size:24px}
.modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.x-btn{border:none;background:var(--surface-2);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:85;box-shadow:-20px 0 60px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:slide .2s}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .db{flex:1;overflow:auto;padding:8px 18px 20px}
.ntf{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:flex-start}
.ntf.unread .dotn{background:var(--gold)}
.ntf .dotn{width:8px;height:8px;border-radius:50%;background:transparent;margin-top:7px;flex:none;border:1px solid var(--line-2)}
.ntf button.l{background:none;border:none;text-align:left;padding:0;flex:1}
.toasts{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:90;display:flex;flex-direction:column;gap:10px;pointer-events:none;width:min(360px,calc(100% - 32px))}
.toast{pointer-events:auto;background:rgba(24,22,19,.96);color:#F2ECE1;border:1px solid #3a352c;border-radius:16px;padding:12px 14px;display:flex;gap:11px;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:drop .25s;cursor:pointer}
@keyframes drop{from{transform:translateY(-12px);opacity:0}}
.toast img{width:34px;height:34px;border-radius:8px;background:#0b0a09;padding:4px;object-fit:contain;flex:none}
.toast .tt{font-size:11px;color:#A79F92;display:flex;justify-content:space-between;gap:8px}
.toast p{font-size:13px;margin-top:1px}
.toast.plain{border-radius:999px;padding:10px 16px;font-size:13px;align-items:center}

/* Simulador */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.sim{grid-template-columns:1fr}}
.sim .phonebox{border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;height:560px;background:var(--chat-bg)}
.sim .phonebox .chh{background:var(--band);color:var(--band-fg);padding:12px 14px;display:flex;gap:10px;align-items:center}
.sim .phonebox .chh img{width:30px;height:30px;object-fit:contain;background:#0b0a09;border-radius:50%;padding:3px;border:1px solid var(--gold)}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:8px 10px;border-radius:8px}
.step .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.step.done .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.cur{background:var(--accent-soft)}
.step.cur .n{border-color:var(--accent);color:var(--accent-ink)}
.changes{display:flex;flex-direction:column;gap:5px;font-size:13px}
.changes div{display:flex;gap:8px;align-items:flex-start}
.changes .icon{color:var(--ok);width:16px;height:16px;margin-top:2px}
.tests{display:flex;flex-wrap:wrap;gap:6px}

/* Tour */
.tour{position:fixed;z-index:95;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:var(--band);color:var(--band-fg);border:1px solid var(--gold);border-radius:16px;padding:18px 20px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
@media (max-width:980px){.tour{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.tour h4{font-size:22px;color:var(--gold-l)}
.tour p{font-size:14px;color:var(--band-muted);margin-top:6px}
.tour .row{margin-top:14px}
.tour .btn{background:transparent;color:var(--band-fg);border-color:#3a352c}
.tour .btn.primary{background:var(--gold);color:#120F0A;border-color:var(--gold)}
.tour .prog{display:flex;gap:4px;margin-bottom:10px}
.tour .prog i{flex:1;height:3px;border-radius:2px;background:#3a352c}
.tour .prog i.on{background:var(--gold)}
.spot{outline:2px solid var(--gold)!important;outline-offset:4px;border-radius:10px;transition:outline-offset .2s}

/* Login */
.login{min-height:100%;display:grid;grid-template-columns:1fr 1fr;background:var(--band)}
.login .l{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 24px;color:var(--band-fg);text-align:center;gap:20px}
.login .l img{width:min(320px,80%)}
.login .r{background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));gap:14px}
.login .r>*{max-width:460px;width:100%;margin:0 auto}
.pcard{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:border-color .15s}
.pcard:hover{border-color:var(--accent)}
.pcard b{display:block;font-weight:500}
.pcard span{font-size:13px;color:var(--muted)}
@media (max-width:860px){.login{grid-template-columns:1fr}.login .l{padding:36px 20px 24px}.login .l img{width:220px}}

/* Tenants */
.tenant-prev{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.tenant-prev .th{padding:14px 16px;display:flex;align-items:center;gap:12px}
.tenant-prev .tl{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:19px;font-weight:600}
.iso{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:800px){.iso{grid-template-columns:1fr}}
.iso>div{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.lock{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:8px}

/* Print: só a folha A4 */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff!important}
  body *{visibility:hidden!important}
  #print-root,#print-root *{visibility:visible!important}
  #print-root{position:absolute;left:0;top:0}
  #print-root .a4{box-shadow:none;margin:0;transform:none!important}
  .a4 tr,.a4 .two,.a4 .sign{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

/* Persistência local (apenas neste navegador) */
const STORE_KEY = 'gmclinic.demo.v3';
let S;
function loadState() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === 3 && s.seededAt === ymd(new Date())) return s; } } catch (e) {}
  return seed();
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function resetState() { S = seed(); saveState(); }
S = loadState();

/* Consultas ao estado */
const svcById = id => S.services.find(s => s.id === id);
const patById = id => S.patients.find(p => p.id === id);
const staffById = id => S.staff.find(s => s.id === id);
const propById = id => S.proposals.find(p => p.id === id);
const convById = id => S.conversations.find(c => c.id === id);
const apptById = id => S.appts.find(a => a.id === id);
const activeAppt = a => a.status !== 'cancelado';
const apptLabel = a => a.type === 'bloqueio' ? 'Bloqueio pessoal' : a.type === 'avaliacao' ? 'Avaliação' + (a.svc ? ' · ' + (svcById(a.svc)||{}).name : '') : (svcById(a.svc)||{name:TYPES[a.type]}).name;
const propTotal = p => Math.max(0, p.items.reduce((t, i) => t + (Number(i.qty)||0) * (Number(i.price)||0), 0) - (Number(p.discount)||0));

/* Disponibilidade da agenda */
function dayWindow(dateStr) {
  const d = parseYmd(dateStr);
  if (S.settings.holidays.includes(dateStr)) return null;
  return S.settings.hours[d.getDay()] || null;
}
function conflicts(dateStr, start, dur, prof, room, ignoreId) {
  return S.appts.filter(a => a.id !== ignoreId && a.date === dateStr && activeAppt(a) && (a.prof === prof || (room && a.room === room && a.type !== 'bloqueio')) && a.start < start + dur && start < a.start + a.dur);
}
function freeSlots(dateStr, dur, prof, room, ignoreId) {
  const w = dayWindow(dateStr); if (!w) return [];
  const out = []; const step = S.settings.step; const [ls, le] = S.settings.lunch;
  const now = new Date(); const isToday = dateStr === ymd(now); const nowMin = now.getHours()*60 + now.getMinutes();
  for (let m = w[0]; m + dur <= w[1]; m += step) {
    if (m < le && ls < m + dur && parseYmd(dateStr).getDay() !== 6) continue;
    if (isToday && m <= nowMin + 30) continue;
    if (parseYmd(dateStr) < sod(now)) continue;
    if (conflicts(dateStr, m, dur, prof, room, ignoreId).length) continue;
    out.push(m);
  }
  return out;
}

function createAppt(o) {
  const a = Object.assign({ id:uid('a'), status:'confirmado', origin:'manual', notes:'', log:[] }, o);

    addHistory(a.pid, `Agendamento: ${apptLabel(a)} em ${fmtDate(a.date)} às ${hm(a.start)}`);
    const p = patById(a.pid);
    if (p && STAGES.indexOf(p.stage) < STAGES.indexOf('Agendada')) setStage(a.pid, 'Agendada');
    addTag(a.pid, a.status === 'confirmado' ? 'agendamento confirmado' : 'agendamento solicitado');
  }
  return a;
}
function setApptStatus(a, status, reason, by) {
  const from = a.status; a.status = status;
  a.log.unshift({ at:nowIso(), by:by || meName(), what:`Status: ${STATUS_LABEL[from]} → ${STATUS_LABEL[status]}${reason ? ' — ' + reason : ''}` });
  if (status === 'cancelado') a.cancelReason = reason || 'Não informado';
  const p = a.pid && patById(a.pid);
  if (p) {
    addHistory(p.id, `${apptLabel(a)} (${fmtDate(a.date)} ${hm(a.start)}): ${STATUS_LABEL[status]}`);
    if (status === 'confirmado') { delTag(p.id, 'agendamento solicitado'); addTag(p.id, 'agendamento confirmado'); }
    if (status === 'compareceu' && STAGES.indexOf(p.stage) < STAGES.indexOf('Compareceu')) setStage(p.id, 'Compareceu');

}

/* ---------- Toasts / notificação no telefone ---------- */
function pushToast(text, go, title) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<img src="${MONO}" alt=""><div class="grow"><div class="tt"><span>${esc(title || S.settings.product)}</span><span>agora</span></div><p>${esc(text)}</p></div>`;
  el.onclick = () => { el.remove(); if (go) goTo(go[0], go[1]); };
  box.prepend(el); setTimeout(() => el.remove(), 6500);
}
function toast(text) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div'); el.className = 'toast plain'; el.textContent = text;
  box.prepend(el); setTimeout(() => el.remove(), 3200);
}

function shell(content) {
  const routes = prof().routes;
  const unread = S.notifications.filter(n => !n.read).length;
  const pend = pendingApprovals().length;
  const waiting = S.conversations.filter(c => c.state === 'aguardando').length;
  const badge = r => r === 'visao' && pend && UI.profile !== 'profissional' ? `<span class="badge">${pend}</span>` : r === 'atendimento' && waiting ? `<span class="badge">${waiting}</span>` : '';
  let lastG = '';
  const sideItems = routes.map(r => { const R = ROUTES[r]; const g = R.g !== lastG ? `<div class="grp">${R.g}</div>` : ''; lastG = R.g;
    return g + `<button class="${UI.route === r ? 'on' : ''}" data-a="go" data-r="${r}">${ic(R.i)}<span>${R.t}</span>${badge(r)}</button>`; }).join('');
  const mainB = routes.slice(0, 4);

  S.proposals.filter(p => p.prof === 'paula').forEach(p => ids.add(p.pid));
  return S.patients.filter(p => ids.has(p.id));

function periodRange(period) {
  const t = sod(new Date());
  if (period === 'hoje') return [t, t];
  if (period === 'semana') { const m = mondayOf(t); return [m, addDays(m, 6)]; }
  if (period === 'mes') return [new Date(t.getFullYear(), t.getMonth(), 1), new Date(t.getFullYear(), t.getMonth()+1, 0)];
  return [addDays(t, -90), addDays(t, 60)];
}
const inRange = (dateStr, [a, b]) => { const d = parseYmd(dateStr); return d >= a && d <= b; };
const isoInRange = (iso, [a, b]) => { const d = sod(new Date(iso)); return d >= a && d <= b; };
function bars(rows, max) {
  const m = max || Math.max(1, ...rows.map(r => r[1]));
  return `<div class="bars">${rows.map(([l, v]) => `<div class="bar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l)}</span><div class="tr"><div class="fl" style="width:${Math.round(v/m*100)}%"></div></div><span class="n">${v}</span></div>`).join('')}</div>`;
}
function vbars(rows, alt) {
  const m = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="vbars">${rows.map(([l, v], i) => `<div class="c"><span class="v">${v}</span><div class="b ${alt && alt(i) ? 'alt' : ''}" style="height:${Math.max(2, Math.round(v/m*120))}px"></div></div>`).join('')}</div><div class="vlabels">${rows.map(r => `<span>${esc(r[0])}</span>`).join('')}</div>`;
}

/* ================= VISÃO GERAL ================= */
function metrics(f) {
  const range = periodRange(f.period);
  let ap = visibleAppts().filter(a => a.type !== 'bloqueio');
  if (f.prof !== 'all') ap = ap.filter(a => a.prof === f.prof);
  if (f.svc !== 'all') ap = ap.filter(a => a.svc === f.svc);
  const inP = ap.filter(a => inRange(a.date, range));
  const act = inP.filter(activeAppt);
  const t = ymd(new Date());
  const props = S.proposals.filter(p => inRange(p.date, range) || f.period === 'tudo').filter(p => f.prof === 'all' || p.prof === f.prof).filter(p => f.svc === 'all' || p.items.some(i => i.svc === f.svc));
  const allProps = S.proposals.filter(p => f.prof === 'all' || p.prof === f.prof);
  const newContacts = S.patients.filter(p => isoInRange(p.created, range));
  const withAppt = new Set(S.appts.filter(a => a.pid && activeAppt(a)).map(a => a.pid));
  const delivered = allProps.filter(p => ['entregue','aguardando retorno','aceita','não aceita','expirada'].includes(p.status));
  const accepted = allProps.filter(p => p.status === 'aceita');
  const payments = S.patients.flatMap(p => p.payments).filter(x => isoInRange(x.at, range));
  return {
    range, inP, act,
    today: ap.filter(a => a.date === t && activeAppt(a)).length,
    week: ap.filter(a => inRange(a.date, periodRange('semana')) && activeAppt(a)).length,
    month: ap.filter(a => inRange(a.date, periodRange('mes')) && activeAppt(a)).length,
    total: act.length,
    confirmed: act.filter(a => a.status === 'confirmado').length,
    pending: act.filter(a => a.status === 'reservado' || a.status === 'solicitado').length,
    waiting: S.conversations.filter(c => c.state === 'aguardando').length,
    newContacts: newContacts.length,
    evals: inP.filter(a => a.type === 'avaliacao' && (a.status === 'compareceu' || a.status === 'concluido')).length,
    attended: inP.filter(a => a.status === 'compareceu' || a.status === 'concluido').length,
    noshow: inP.filter(a => a.status === 'falta').length,
    returns: ap.filter(a => a.type === 'retorno' && parseYmd(a.date) >= sod(new Date()) && activeAppt(a)).length,
    propsIssued: props.length,
    propsAccepted: props.filter(p => p.status === 'aceita').length,
    propsPending: props.filter(p => ['entregue','aguardando retorno','pronta para revisão'].includes(p.status)).length,
    revenue: payments.reduce((t, x) => t + (Number(x.value)||0), 0),
    convContact: S.patients.length ? Math.round(S.patients.filter(p => withAppt.has(p.id)).length / S.patients.length * 100) : 0,
    convProp: delivered.length ? Math.round(accepted.length / delivered.length * 100) : 0,
  };
}

VIEWS.relatorios = () => {
  const f = UI.rep; const range = f.period === 'tri' ? [addDays(sod(new Date()), -90), addDays(sod(new Date()), 30)] : periodRange(f.period);
  let ap = S.appts.filter(a => a.type !== 'bloqueio' && inRange(a.date, range));
  if (f.prof !== 'all') ap = ap.filter(a => a.prof === f.prof); if (f.svc !== 'all') ap = ap.filter(a => a.svc === f.svc); if (f.status && f.status !== 'all') ap = ap.filter(a => a.status === f.status);
  const past = ap.filter(a => parseYmd(a.date) < sod(new Date()) || a.status === 'compareceu');
  const act = ap.filter(activeAppt);
  const confRate = act.length ? Math.round(act.filter(a => ['confirmado','compareceu','concluido'].includes(a.status)).length / act.length * 100) : 0;
  const pastDone = past.filter(a => ['compareceu','concluido','falta'].includes(a.status));
  const showRate = pastDone.length ? Math.round(pastDone.filter(a => a.status !== 'falta').length / pastDone.length * 100) : 0;
  const mon = mondayOf(new Date());
  const weeks = Array.from({ length:8 }, (_, i) => { const s = addDays(mon, (i-5)*7); return [pad2(s.getDate()) + '/' + pad2(s.getMonth()+1), S.appts.filter(a => a.type !== 'bloqueio' && activeAppt(a) && (f.prof==='all'||a.prof===f.prof) && (f.svc==='all'||a.svc===f.svc) && inRange(a.date, [s, addDays(s, 6)])).length]; });
  const hours = [9,10,11,13,14,15,16,17,18].map(h => [h + 'h', act.filter(a => Math.floor(a.start/60) === h).length]);
  const reasons = {}; ap.filter(a => a.status === 'cancelado').forEach(a => { const r = (a.cancelReason || 'Não informado').replace(/^Recusado:.*/, 'Recusado pela clínica'); reasons[r] = (reasons[r]||0) + 1; });
  const props = S.proposals.filter(p => inRange(p.date, range) && (f.prof==='all'||p.prof===f.prof));
  const accepted = S.proposals.filter(p => p.status === 'aceita');
  const revenue = S.patients.flatMap(p => p.payments).filter(x => isoInRange(x.at, range)).reduce((t, x) => t + (Number(x.value)||0), 0);
  const forecast = accepted.reduce((t, p) => t + propTotal(p), 0);
  let avail = 0, booked = 0; for (let d = new Date(range[0]); d <= range[1]; d = addDays(d, 1)) { const w = dayWindow(ymd(d)); if (w) { avail += (w[1]-w[0]) - (d.getDay() !== 6 ? S.settings.lunch[1]-S.settings.lunch[0] : 0); } }
  booked = act.reduce((t, a) => t + a.dur, 0) + S.appts.filter(a => a.type === 'bloqueio' && inRange(a.date, range)).reduce((t, a) => t + a.dur, 0);
  const profs = Math.max(1, f.prof === 'all' ? 2 : 1); const occ = avail ? Math.min(100, Math.round(booked / (avail * profs) * 100)) : 0;
  const frt = S.conversations.map(c => { const i = c.msgs.findIndex(m => m.from === 'paciente'); const r = c.msgs.slice(i+1).find(m => m.from === 'ia' || m.from === 'humano'); return i >= 0 && r ? (new Date(r.at) - new Date(c.msgs[i].at)) / 60000 : null; }).filter(x => x != null);
  const frtAvg = frt.length ? Math.max(0, Math.round(frt.reduce((a,b)=>a+b,0) / frt.length)) : null;
  return `
  <div class="page-h"><div><span class="eyebrow">Relatórios e gestão</span><h1>Relatórios</h1><p>Dados fictícios ou lançados durante a demonstração. Sem indicadores clínicos.</p></div></div>
  <div class="filters"><div class="seg">${[['semana','Semana'],['mes','Mês'],['tri','Trimestre'],['tudo','Tudo']].map(([k,l]) => `<button class="${f.period===k?'on':''}" data-a="repPeriod" data-v="${k}">${l}</button>`).join('')}</div>
    <select class="input" style="width:auto" data-c="repF" data-k="prof" aria-label="Profissional"><option value="all">Todas as profissionais</option>${S.staff.filter(s=>s.id!=='camila').map(s=>`<option value="${s.id}" ${f.prof===s.id?'selected':''}>${esc(s.short)}</option>`).join('')}</select>
    <select class="input" style="width:auto" data-c="repF" data-k="svc" aria-label="Serviço"><option value="all">Todos os serviços</option>${S.services.map(s=>`<option value="${s.id}" ${f.svc===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
    <select class="input" style="width:auto" data-c="repF" data-k="status" aria-label="Status"><option value="all">Todos os status</option>${APPT_STATUS.map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div>
  <div class="kpis">
    <div class="kpi"><span class="l">Agendamentos no período</span><span class="v">${act.length}</span></div>
    <div class="kpi"><span class="l">Taxa de confirmação</span><span class="v">${confRate}%</span><span class="s">confirmados entre os ativos</span></div>
    <div class="kpi"><span class="l">Taxa de comparecimento</span><span class="v">${showRate}%</span><span class="s">${pastDone.filter(a=>a.status==='falta').length} falta(s)</span></div>
    <div class="kpi"><span class="l">Agenda ocupada</span><span class="v">${occ}%</span><span class="s">${100-occ}% disponível</span></div>
    <div class="kpi"><span class="l">Primeira resposta</span><span class="v">${frtAvg == null ? '—' : frtAvg < 1 ? '< 1 min' : frtAvg + ' min'}</span><span class="s">média das conversas</span></div>
    <div class="kpi"><span class="l">Receita registrada</span><span class="v" style="font-size:28px">${brl(revenue)}</span><span class="s">lançamentos manuais</span></div>
    <div class="kpi"><span class="l">Propostas aceitas (previsão)</span><span class="v" style="font-size:28px">${brl(forecast)}</span><span class="s">não é recebimento · valores fictícios</span></div>
  </div>
  <div class="dash-grid">
    <div class="card"><div class="card-h"><h3>Agendamentos por semana</h3><span class="muted xs">5 semanas anteriores, atual e 2 próximas</span></div>${vbars(weeks, i => i > 5)}</div>
    <div class="card"><div class="card-h"><h3>Horários mais procurados</h3></div>${vbars(hours)}</div>
    <div class="card"><div class="card-h"><h3>Procedimentos com mais pedidos de informação</h3></div>${bars(S.services.map(s => [s.name, S.patients.filter(p => p.interests.includes(s.id)).length]).sort((a,b)=>b[1]-a[1]))}</div>
    <div class="card"><div class="card-h"><h3>Contatos por origem</h3></div>${bars(ORIGINS.map(o => [o.replace(' (tráfego pago)',' (pago)'), S.patients.filter(p => p.origin === o).length]).sort((a,b)=>b[1]-a[1]))}</div>
    <div class="card"><div class="card-h"><h3>Propostas no período</h3></div>${bars([['Emitidas', props.length],['Aceitas', props.filter(p=>p.status==='aceita').length],['Pendentes', props.filter(p=>['entregue','aguardando retorno','pronta para revisão'].includes(p.status)).length],['Não aceitas', props.filter(p=>p.status==='não aceita').length],['Expiradas', props.filter(p=>p.status==='expirada').length]])}</div>
    <div class="card"><div class="card-h"><h3>Motivos de cancelamento</h3><span class="muted xs">quando informados</span></div>${Object.keys(reasons).length ? bars(Object.entries(reasons)) : '<div class="empty">Nenhum cancelamento no período.</div>'}</div>
  </div>
  <p class="note" style="margin-top:16px">Comparações entre clínicas (no módulo de licenças) nunca exibem resultados clínicos, indicadores de saúde ou dados de pacientes.</p>`;
};
